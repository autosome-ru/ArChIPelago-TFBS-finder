name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -r requirements.txt
      - name: Unit and integration tests
        run: pytest
      - name: CTCF scan with null calibration
        if: matrix.python-version == '3.12'
        run: |
          python scanning_tool.py -f realdata_CTCF_test.fasta --tf CTCF -o scan_out
          test "$(tail -n +2 scan_out/CTCF_predictions_full.tsv | wc -l)" -eq 79
